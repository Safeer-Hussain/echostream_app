name: echo_stream_app
description: "Flagship Lossless Spatial Audio Streaming Platform, Live Interactive Podcast & Audio Room Studio, Native 10-Band Hardware DSP Equalizer Bridge, Offline Media Vault, and On-Device AI Transcript Copilot in Flutter."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  shared_preferences: ^2.5.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  fl_chart: ^1.1.1
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  intl: ^0.20.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
